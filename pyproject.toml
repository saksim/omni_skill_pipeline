[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-skill-pipeline"
version = "0.2.4"
description = "Distill text, audio, video, and image evidence into reusable SKILL artifacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "saksim" }
]
dependencies = [
  "cryptography>=42.0,<47.0",
  "pydantic>=2.8,<3.0",
  "pillow>=10.0,<13.0",
  "pypdf>=4.0,<6.0",
  "beautifulsoup4>=4.12,<5.0",
  "python-docx>=1.1,<2.0",
  "openai>=2.30,<3.0",
  "pandas>=2.2,<2.3",
  "numpy>=1.26,<2.0",
  "openpyxl>=3.1,<4.0"
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0"
]
dev = [
  "jsonschema>=4.23,<5.0",
  "coverage>=7.6,<8.0"
]
postgres = [
  "psycopg[binary]>=3.2,<4.0"
]

[project.scripts]
omni-skill = "omni_skill_pipeline.cli:main"
omni-worker = "omni_skill_pipeline.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omni_skill_pipeline = [
  "resources/contracts/*.json",
  "resources/contracts/*.md"
]

[tool.coverage.run]
branch = true
parallel = true
source = ["omni_skill_pipeline"]
omit = [
  "tests/*",
  "apps/*"
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]
