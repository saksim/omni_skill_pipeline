[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-skill-pipeline"
version = "0.2.0"
description = "Distill text, audio, video, and image evidence into reusable SKILL artifacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Codex" }
]
dependencies = [
  "pydantic>=2.8,<3.0",
  "pillow>=10.0,<12.0",
  "pypdf>=4.0,<6.0",
  "beautifulsoup4>=4.12,<5.0",
  "python-docx>=1.1,<2.0",
  "openai>=2.30,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0"
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0"
]
dev = []

[project.scripts]
omni-skill = "omni_skill_pipeline.cli:main"
omni-worker = "omni_skill_pipeline.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
