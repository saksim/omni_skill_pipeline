apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: omni-skill-pipeline
  labels:
    app.kubernetes.io/name: omni-skill-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: omni-skill-pipeline
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
