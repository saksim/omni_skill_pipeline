apiVersion: apps/v1
kind: Deployment
metadata:
  name: omni-skill-pipeline
  labels:
    app.kubernetes.io/name: omni-skill-pipeline
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: omni-skill-pipeline
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omni-skill-pipeline
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/saksim/omni-skill-pipeline:0.2.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: omni-skill-pipeline-config
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-skill-pipeline-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: OMNI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-skill-pipeline-secrets
                  key: OMNI_API_KEY
                  optional: true
            - name: OMNI_POSTGRES_REPOSITORY_DSN
              valueFrom:
                secretKeyRef:
                  name: omni-skill-pipeline-secrets
                  key: OMNI_POSTGRES_REPOSITORY_DSN
                  optional: true
            - name: OMNI_ARTIFACT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: omni-skill-pipeline-secrets
                  key: OMNI_ARTIFACT_ENCRYPTION_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: skills-workdir
              mountPath: /app/skills
      volumes:
        - name: skills-workdir
          emptyDir: {}
